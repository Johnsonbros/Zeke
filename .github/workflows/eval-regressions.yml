name: Eval regressions

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  run-evals:
    runs-on: ubuntu-latest
    env:
      # Promote secrets to job-level env so they can be referenced in `if:`
      # conditions (the `secrets` context is not available in `if:`).
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_EVAL_GUID: ${{ secrets.OPENAI_EVAL_GUID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run eval suite
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: python eval/runner.py --ci --openai-evals

      - name: Skip notice (no credentials configured)
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo "OPENAI_API_KEY secret not configured - skipping eval suite (not a failure)."

      - name: Upload eval run metadata
        if: ${{ always() && env.OPENAI_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-runs
          path: eval/runs/*.json
          if-no-files-found: warn
